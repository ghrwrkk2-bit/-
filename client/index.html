<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات حسوني</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
<i class="fa-solid fa-comment"></i>
<h2>شات حسوني</h2>
</div>

<div class="top-menu">

<button>
<i class="fa-solid fa-bell"></i>
الإشعارات
</button>

<button>
<i class="fa-solid fa-user-plus"></i>
طلب
</button>

<button>
<i class="fa-solid fa-envelope"></i>
رسالة
</button>

</div>

</header>


<div class="layout">


<aside>

<div class="profile">

<img src="https://i.imgur.com/8Km9tLL.png">

<h3>حسوني 👑</h3>

<span>مالك الموقع</span>

</div>


<ul>

<li class="active">
<i class="fa fa-home"></i>
الرئيسية
</li>

<li>
<i class="fa fa-users"></i>
المتواجدين
</li>

<li>
<i class="fa fa-microphone"></i>
الغرف الصوتية
</li>

<li>
<i class="fa fa-gift"></i>
المتجر
</li>

<li>
<i class="fa fa-shield"></i>
لوحة التحكم
</li>

</ul>


<button class="create">
+ إنشاء غرفة
</button>


</aside>



<main>


<div class="room">

<h1>
👑 الغرفة العامة
</h1>

<p>
🟢 125 متواجد الآن
</p>

</div>



<div class="messages">


<div class="message">

<img src="https://i.imgur.com/8Km9tLL.png">

<div>

<b class="owner">
حسوني 👑
</b>

<p>
أهلاً بالجميع في شات حسوني 💙
</p>

</div>

</div>



<div class="message">

<img src="https://i.imgur.com/7vQZ0XG.png">

<div>

<b>
سارة ⭐
</b>

<p>
مرحبا بالجميع 🌹
</p>

</div>

</div>



<div class="message">

<img src="https://i.imgur.com/8Km9tLL.png">

<div>

<b>
ككرار
</b>

<p>
كيفكم اليوم؟
</p>

</div>

</div>


</div>




<div class="send">

<input placeholder="اكتب رسالتك هنا...">

<button>
<i class="fa fa-paper-plane"></i>
</button>

</div>



</main>




<section class="right">

<h2>
المتواجدين الآن
</h2>


<div class="online">
🟢 حسوني 👑
</div>


<div class="online">
🟢 سارة ⭐
</div>


<div class="online">
🟢 ككرار
</div>


</section>


</div>



<footer>

<button>
<i class="fa fa-home"></i>
الغرف
</button>


<button>
<i class="fa fa-store"></i>
المتجر
</button>


<button>
<i class="fa fa-users"></i>
الأصدقاء
</button>


<button>
<i class="fa fa-gear"></i>
الإعدادات
</button>


</footer>


<script src="script.js"></script>

</body>

</html>
